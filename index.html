<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FDC VR</title>
    <meta name="theme-color" content="#6f8a3c" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #eef3e6; }
      #app, #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #hud {
        position: fixed; top: 16px; left: 16px; max-width: min(360px, calc(100vw - 32px));
        padding: 14px 16px; border-radius: 14px; display: grid; gap: 10px;
        background: rgba(255, 255, 255, 0.9); color: #1f2a17;
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        box-shadow: 0 6px 24px rgba(31, 42, 23, 0.12);
      }
      #hud[hidden] { display: none; }
      .brand { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
      .brand b { color: #6f8a3c; }
      .status { color: #5d6650; font-size: 13px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      .row button {
        font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 8px 16px;
        cursor: pointer; background: #6f8a3c; color: #fff;
      }
      .row button.secondary { background: #e3ead6; color: #1f2a17; }
      .row button:focus-visible { outline: 3px solid #b9d77a; outline-offset: 2px; }
      .help { margin: 0; color: #5d6650; font-size: 12.5px; }
      kbd { font: 12px ui-monospace, Menlo, monospace; background: #eef3e6; border-radius: 4px; padding: 1px 5px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="brand"><b>fdc</b> VR</div>
      <div class="status" id="status">Loading…</div>
      <div class="row">
        <button id="enter-vr" type="button" hidden>Enter VR</button>
        <button id="to-lobby" type="button" class="secondary" hidden>Back to lobby</button>
      </div>
      <p class="help">
        Desktop preview: drag to look · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move ·
        click buttons and targets · <kbd>L</kbd> for lobby
      </p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
